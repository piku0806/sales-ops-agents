[project]
name = "salesops-agents"
version = "0.1.0"
description = "Multi-agent sales ops workflow with MCP tools, human approval gates and audit logging, runnable on Microsoft Foundry."
requires-python = ">=3.10"
dependencies = ["mcp>=1.10", "openai>=1.40", "fastapi>=0.110", "uvicorn>=0.29", "python-dotenv>=1.0"]

[project.optional-dependencies]
azure = ["azure-identity>=1.17"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
salesops = "salesops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
salesops = ["seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
